# Supabase CLI Configuration — MANASARA
# Docs: https://supabase.com/docs/reference/cli/config

project_id = "mcnrarmkuyzyycpuvtec"

[api]
enabled = true
# Local REST & realtime port
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
# Local Postgres port
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
# ip_version = "IPv4"

[studio]
enabled = true
# Local Supabase Studio port
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
# Local email testing
host = "127.0.0.1"
port = 54325

[storage]
enabled = true
# Max file upload size for product images and store assets
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
# Auth server port (internal)
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Customer sign-up enabled for account/order tracking features
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enabled = true
enable_confirmations = false

[auth.sms]
enabled = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# ─────────────────────────────────────────────
# Edge Functions — MANASARA business logic
# ─────────────────────────────────────────────

[functions.place-order]
verify_jwt = false

[functions.submit-payment-reference]
verify_jwt = false

[functions.verify-payment]
verify_jwt = true

[functions.track-order]
verify_jwt = false

[functions.update-order-status]
verify_jwt = true

[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
